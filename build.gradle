// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext{
        kotlin_version = '2.0.21'
        androidx_core_version = '1.10.1'
        navigation_version = '2.9.6'
        timber_version = '5.0.1'
        hilt_version = '2.57.1'
        retrofit_version = '2.9.0'
        okhttp_version = '4.9.3'
        dataStore_version = '1.0.0'
        glide_version = '4.14.2'
        glide_transformations_version = '4.3.0'
        lifecycle_version = '2.5.1'
        kotlinx_serialize_version = '1.8.0'
        paging_version = "3.1.1"
        cryptoBusVersion = '1.1.0-alpha03'
    }
    dependencies {
        classpath libs.gradle
        // navigation for safe args
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$navigation_version"
        // hilt
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
        classpath(libs.secrets.gradle.plugin)
    }
}

plugins {
    id 'com.android.application' version '9.1.0' apply false
    id 'com.android.library' version '9.1.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
    id 'com.google.gms.google-services' version '4.4.4' apply false
    id("com.google.firebase.crashlytics") version "3.0.6" apply false
    id("com.google.devtools.ksp") version '2.0.21-1.0.25' apply false
    id("androidx.navigation.safeargs.kotlin") version '2.9.7' apply false
    id("com.google.dagger.hilt.android") version "2.57.1" apply false
}

layout.buildDirectory