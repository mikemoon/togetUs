// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext{
        kotlin_version = '1.9.0'
        androidx_core_version = '1.10.1'
        navigation_version = '2.6.0-alpha05'
        timber_version = '5.0.1'
        hilt_version = '2.55'
        retrofit_version = '2.9.0'
        okhttp_version = '4.9.3'
        dataStore_version = '1.0.0'
        glide_version = '4.14.2'
        glide_transformations_version = '4.3.0'
        lifecycle_version = '2.5.1'
        kotlinx_serialize_version = '1.8.0'
        paging_version = "3.1.1"
        cryptoBusVersion = '1.1.0-alpha03'
    }
    dependencies {
        classpath libs.gradle
        // navigation for safe args
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$navigation_version"
        // hilt
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlinx_serialize_version"
        classpath("com.google.android.libraries.mapsplatform.secrets-gradle-plugin:secrets-gradle-plugin:2.0.1")
    }
}

plugins {
    id 'com.android.application' version '8.5.2' apply false
    id 'com.android.library' version '7.2.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
    id 'com.google.gms.google-services' version '4.4.2' apply false
    id("com.google.firebase.crashlytics") version "3.0.2" apply false
    id("com.google.devtools.ksp") version "2.0.21-1.0.27" apply false
    id("androidx.navigation.safeargs.kotlin") version "2.7.5" apply false
    id("com.google.dagger.hilt.android") version "2.51.1" apply false
}

layout.buildDirectory